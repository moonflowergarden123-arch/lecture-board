<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0D2B22" />
<title>러키 모니터 러그 · 더콘텐츠스쿨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%239DC4F2%22/%3E%3Cpath%20fill-rule%3D%22evenodd%22%20fill%3D%22%23FFFDF7%22%20d%3D%22M17%2013h30a6%206%200%200%201%206%206v26a6%206%200%200%201-6%206H17a6%206%200%200%201-6-6V19a6%206%200%200%201%206-6zm8%2012a4%204%200%200%200-4%204v10a4%204%200%200%200%204%204h14a4%204%200%200%200%204-4V29a4%204%200%200%200-4-4z%22/%3E%3C/svg%3E">
<style>
  :root{
    --green:#1F3D2B; --green-d:#0D2B22; --green-l:#2C5740;
    --cream:#FAF8F2; --gold:#FFC24B; --ink:#0F2119;
    --font:"Paperozi","페이퍼로지","Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#0D2B22;font-family:var(--font);color:var(--cream);overscroll-behavior:none}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #floor,#shadow,#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #floor{z-index:0}
  #desktop{z-index:2}
  #shadow{z-index:3}
  #gl{z-index:4}
  #vignette{z-index:5}
  #shadow{filter:blur(15px);pointer-events:none;opacity:.95;z-index:3}
  #gl{touch-action:none;cursor:grab;opacity:0;transition:opacity .45s ease}
  #gl.ready{opacity:1}
  #gl.holding{cursor:grabbing}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(125% 95% at 50% 42%,rgba(0,0,0,0) 52%,rgba(0,0,0,.26) 100%)}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 9px;border-radius:999px;
    background:rgba(13,43,34,.72);border:1px solid rgba(250,248,242,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px rgba(0,0,0,.22);pointer-events:auto}
  .brand-badge{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#9DC4F2,#7FB0EA);
    box-shadow:inset 0 -2px 6px rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.2)}
  .brand b{display:block;font-size:14.5px;letter-spacing:-.2px;line-height:1.25}
  .brand small{display:block;font-size:11px;opacity:.66;letter-spacing:.2px;margin-top:1px}
  .tools{display:flex;gap:8px;pointer-events:auto}
  .btn{font-family:var(--font);font-size:13px;font-weight:600;color:var(--cream);background:rgba(13,43,34,.72);
    border:1px solid rgba(250,248,242,.16);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.2);transition:transform .12s ease,background .15s ease,border-color .15s}
  .btn:hover{background:rgba(31,61,43,.9);border-color:rgba(255,194,75,.45)}
  .btn:active{transform:scale(.97)}
  .btn svg{width:15px;height:15px;flex:none}
  .btn.icon{padding:10px 12px}

  /* ---------- hint / toast ---------- */
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;
    padding:10px 18px;border-radius:999px;background:rgba(13,43,34,.66);border:1px solid rgba(250,248,242,.13);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;color:rgba(250,248,242,.88);
    pointer-events:none;z-index:25;transition:opacity .5s ease;white-space:nowrap;max-width:min(94vw,720px);overflow:hidden}
  .hint span{display:inline-flex;align-items:center;gap:6px}
  .hint span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.8}
  .hint.fade{opacity:0}
  .toast{position:absolute;left:50%;top:78px;transform:translate(-50%,-8px);padding:11px 20px;border-radius:14px;
    background:rgba(250,248,242,.95);color:#1a2e23;font-size:13.5px;font-weight:650;letter-spacing:-.2px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:40;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- office hud ---------- */
  .office-hud{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:9px 16px;border-radius:999px;
    background:rgba(10,20,30,.7);border:1px solid rgba(255,255,255,.14);color:#eaf2ff;font-size:12.5px;letter-spacing:-.2px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:26;pointer-events:none;transition:opacity .3s}
  .office-hud b{color:var(--gold);font-size:14px;margin:0 2px}
  .office-hud[hidden]{display:none}

  /* ---------- desktop icons ---------- */
  #desktop{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .35s ease}
  #desktop.on{opacity:1}
  .desk-col{position:absolute;top:104px;display:grid;grid-template-columns:repeat(2,104px);gap:16px 8px}
  .desk-col.left{left:16px}
  .desk-col.right{right:16px}
  .ico{width:104px;padding:7px 4px 8px;border-radius:12px;text-align:center;color:#f2f7ff;
    font-size:11.5px;line-height:1.25;letter-spacing:-.2px;text-shadow:0 1px 3px rgba(0,0,0,.55);transition:opacity .3s,filter .3s,transform .3s}
  .ico-art{width:52px;height:52px;margin:0 auto 5px;display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  .ico-art svg{width:100%;height:100%}
  .ico.covered{opacity:.26;filter:grayscale(.85) brightness(.7)}
  .ico.covered .ico-art{transform:scale(.94)}

  /* ---------- taskbar ---------- */
  .taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;background:rgba(8,14,22,.68);border-top:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#e7eefb;font-size:12px;z-index:6;pointer-events:none}
  .taskbar[hidden]{display:none}
  .tb-left{display:flex;align-items:center;gap:8px}
  .tb-start{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(150deg,#7FB0EA,#4E86C9);color:#0b1a2a;font-weight:800;font-size:13px}
  .tb-app{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .tb-app i{display:block;width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.55)}
  .tb-right{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
  .tb-right #tbDate{opacity:.62;font-size:10.5px}

  /* ---------- menu ---------- */
  .menu{position:absolute;z-index:50;width:288px;padding:16px;border-radius:20px;
    background:linear-gradient(170deg,rgba(24,52,39,.97),rgba(11,31,24,.97));
    border:1px solid rgba(255,194,75,.24);box-shadow:0 26px 60px rgba(0,0,0,.45);color:var(--cream);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .menu[hidden]{display:none}
  .menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .menu-head b{font-size:14.5px;letter-spacing:-.2px}
  .menu-close{background:none;border:0;color:rgba(250,248,242,.6);font-size:16px;cursor:pointer;padding:4px 6px;border-radius:8px;font-family:var(--font)}
  .menu-close:hover{background:rgba(255,255,255,.08);color:#fff}
  .row{display:flex;gap:8px}
  .row.two>*{flex:1}
  .menu .btn{background:rgba(250,248,242,.08);border-color:rgba(250,248,242,.14);box-shadow:none;justify-content:center;padding:10px 8px;font-size:12.5px}
  .menu .btn:hover{background:rgba(255,194,75,.16);border-color:rgba(255,194,75,.5)}
  .menu .btn.solid{background:rgba(255,194,75,.9);color:#1d2f22;border-color:transparent;font-weight:750}
  .menu .btn.solid:hover{background:#FFD070}
  .field{display:block;margin-top:14px}
  .field>span{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(250,248,242,.68);margin-bottom:7px;letter-spacing:.1px}
  .field em{font-style:normal;color:var(--gold);font-weight:700}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;background:rgba(250,248,242,.18);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #16301f;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #16301f}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font-family:var(--font);font-size:11.5px;font-weight:650;color:rgba(250,248,242,.72);background:rgba(250,248,242,.07);
    border:1px solid rgba(250,248,242,.12);border-radius:10px;padding:9px 4px;cursor:pointer;transition:.15s}
  .seg button:hover{background:rgba(250,248,242,.14)}
  .seg button.on{background:rgba(255,194,75,.92);color:#1d2f22;border-color:transparent}
  .tip{margin:14px 0 0;font-size:11px;line-height:1.55;color:rgba(250,248,242,.5)}
  .menu .row.two{margin-top:0}
  .sep{height:1px;background:rgba(250,248,242,.1);margin:14px 0 0}

  .fatal{position:absolute;inset:0;display:grid;place-items:center;background:#0D2B22;color:var(--cream);padding:30px;text-align:center;z-index:99;font-size:14px;line-height:1.7}
  @media (max-width:640px){
    .brand small{display:none}
    .btn span.lbl{display:none}
    .hint{font-size:11px;gap:9px;padding:9px 13px;bottom:18px}
    .hint span:nth-child(4){display:none}
    .desk-col{grid-template-columns:repeat(2,88px);gap:12px 4px;top:88px}
    .ico{width:88px;font-size:10.5px}
    .ico-art{width:44px;height:44px}
    .menu{width:min(288px,calc(100vw - 24px))}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="floor"></canvas>
  <div id="desktop">
    <div class="desk-col left" id="deskLeft"></div>
    <div class="desk-col right" id="deskRight"></div>
  </div>
  <canvas id="shadow"></canvas>
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <div id="taskbar" class="taskbar" hidden>
    <div class="tb-left">
      <span class="tb-start">▦</span>
      <span class="tb-app"><i></i></span>
      <span class="tb-app"><i style="background:#7FB0EA"></i></span>
      <span class="tb-app"><i style="background:#FFC24B"></i></span>
    </div>
    <div class="tb-right">
      <span id="tbClock">19:07</span>
      <span id="tbDate">2026-11-21</span>
    </div>
  </div>

  <header class="hud">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true"><svg viewBox="0 0 32 32" width="21" height="21"><path fill-rule="evenodd" fill="#FFFDF7" d="M7 5h18a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4zm4.2 6.4a2 2 0 0 0-2 2v5.2a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2v-5.2a2 2 0 0 0-2-2z"/></svg></span>
      <div><b>러키 모니터 러그</b><small>피클 AI · 러키</small></div>
    </div>
    <div class="tools">
      <button class="btn" id="btnPhoto" aria-label="내 사진으로 바꾸기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1-1.7h6.6l1 1.7h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
        <span class="lbl">사진 넣기</span>
      </button>
      <button class="btn icon" id="btnFull" aria-label="전체 화면">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
      </button>
      <button class="btn icon" id="btnMenu" aria-label="메뉴">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <div class="office-hud" id="officeHud" hidden>업무 아이콘 <b id="coverN">0</b> / <span id="coverT">8</span> 덮음</div>

  <div class="hint" id="hint">
    <span>잡아서 당기기</span><span>휙 던지기</span><span>두 번 클릭 = 펴기</span><span>휠 = 크기</span>
  </div>

  <div class="menu" id="menu" hidden>
    <div class="menu-head"><b>러그 설정</b><button class="menu-close" id="menuClose" aria-label="닫기">✕</button></div>
    <div class="row two">
      <button class="btn solid" id="mFlatten">펴기</button>
      <button class="btn" id="mCenter">가운데로</button>
    </div>
    <label class="field"><span>부드러움 <em id="softVal">60%</em></span>
      <input type="range" id="soft" min="0" max="100" value="60" aria-label="부드러움"></label>
    <label class="field"><span>크기 <em id="sizeVal">100%</em></span>
      <input type="range" id="size" min="45" max="165" value="100" aria-label="크기"></label>
    <div class="field"><span>배경</span>
      <div class="seg" id="bgSeg">
        <button data-bg="wood" class="on">나무 바닥</button>
        <button data-bg="office">사무실</button>
        <button data-bg="green">딥그린</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="row two" style="margin-top:14px">
      <button class="btn" id="mPhoto">사진 넣기</button>
      <button class="btn" id="mReset">러키로</button>
    </div>
    <p class="tip">잡아당기면 진짜 천처럼 구겨지고, 휙 놓으면 날아가 바닥에 안착해요. 두 번 클릭하면 스르륵 펴집니다.</p>
  </div>

  <div class="toast" id="toast"></div>
</div>

<input type="file" id="filePick" accept="image/*" hidden />

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 업로드한 사진을 '러그'처럼 : 크림색 플러시 테두리 + 사진 인쇄 */
function buildPhotoTexture(img){
  const S=1024, c=document.createElement('canvas');
  c.width=c.height=S;
  const x=c.getContext('2d');
  x.clearRect(0,0,S,S);
  const pad=18, r=74;
  // 바탕 러그(크림)
  const g=x.createLinearGradient(0,0,S,S);
  g.addColorStop(0,'#FFFDF7'); g.addColorStop(.5,'#F7EFDD'); g.addColorStop(1,'#EBDCBE');
  x.fillStyle=g;
  roundRectPath(x,pad,pad,S-pad*2,S-pad*2,r); x.fill();
  // 사진 영역
  const ip=pad+46, ir=44;
  x.save();
  roundRectPath(x,ip,ip,S-ip*2,S-ip*2,ir); x.clip();
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const box=S-ip*2;
  const sc=Math.max(box/iw,box/ih);
  const dw=iw*sc, dh=ih*sc;
  x.drawImage(img,(S-dw)/2,(S-dh)/2,dw,dh);
  x.restore();
  // 안쪽 그림자 + 스티치
  x.save();
  roundRectPath(x,ip,ip,S-ip*2,S-ip*2,ir); x.clip();
  const sh=x.createRadialGradient(S/2,S/2,S*0.3,S/2,S/2,S*0.62);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(60,40,10,.20)');
  x.fillStyle=sh; x.fillRect(0,0,S,S);
  x.restore();
  x.strokeStyle='rgba(120,95,50,.42)'; x.lineWidth=3; x.setLineDash([13,11]);
  roundRectPath(x,ip+10,ip+10,S-(ip+10)*2,S-(ip+10)*2,ir-6); x.stroke();
  x.setLineDash([]);
  // 털 테두리 (바깥쪽 보들보들)
  for(let i=0;i<1400;i++){
    const t=i/1400*TAU;
    const rr=(S/2-pad);
    const wob=1+0.012*Math.sin(t*17)+0.008*Math.sin(t*41+1.3);
    const cx=S/2+Math.cos(t)*rr*wob, cy=S/2+Math.sin(t)*rr*wob;
    const rad=Math.random()*9+2.5;
    x.fillStyle='rgba(255,252,244,'+(0.35+Math.random()*0.4)+')';
    x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  return c;
}

/* =========================================================
   4. WebGL (천 렌더링)
   ========================================================= */
const GRID=35, N=GRID*GRID;

const VS=`
attribute vec2 a_pos;
attribute vec2 a_uv;
attribute float a_light;
uniform vec2 u_res;
varying vec2 v_uv;
varying float v_light;
void main(){
  v_uv=a_uv; v_light=a_light;
  vec2 ndc=vec2(a_pos.x/(u_res.x*0.5), a_pos.y/(u_res.y*0.5));
  gl_Position=vec4(ndc,0.0,1.0);
}`;
const FS=`
precision mediump float;
uniform sampler2D u_tex;
varying vec2 v_uv;
varying float v_light;
void main(){
  vec4 c=texture2D(u_tex,v_uv);
  if(c.a<0.012) discard;
  gl_FragColor=vec4(c.rgb*v_light*c.a, c.a);
}`;

let prog=null,posBuf=null,uvBuf=null,lightBuf=null,idxBuf=null;
let aPos=0,aUv=0,aLight=0,uRes=null,uTex=null;
let tex=null;
const posArr=new Float32Array(N*2);
const lightArr=new Float32Array(N);
const uvArr=new Float32Array(N*2);
let idxCount=0;

function initGL(){
  gl=GL.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:true,depth:false,stencil:false,powerPreference:'high-performance'})
     || GL.getContext('experimental-webgl',{alpha:true,premultipliedAlpha:true,antialias:true});
  if(!gl){ fatal('이 브라우저에서는 WebGL을 켜야 러그가 움직여요. 크롬·엣지·사파리 최신 버전에서 열어 주세요.'); return false; }
  const vs=compile(gl.VERTEX_SHADER,VS), fs=compile(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs) return false;
  prog=gl.createProgram();
  gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ fatal('렌더러 초기화 실패: '+gl.getProgramInfoLog(prog)); return false; }
  gl.useProgram(prog);
  aPos=gl.getAttribLocation(prog,'a_pos');
  aUv=gl.getAttribLocation(prog,'a_uv');
  aLight=gl.getAttribLocation(prog,'a_light');
  uRes=gl.getUniformLocation(prog,'u_res');
  uTex=gl.getUniformLocation(prog,'u_tex');
  posBuf=gl.createBuffer(); uvBuf=gl.createBuffer(); lightBuf=gl.createBuffer(); idxBuf=gl.createBuffer();

  // uv (고정)
  for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++){
    const k=(j*GRID+i)*2;
    uvArr[k]=i/(GRID-1);
    uvArr[k+1]=j/(GRID-1);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);
  gl.bufferData(gl.ARRAY_BUFFER,uvArr,gl.STATIC_DRAW);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST);
  return true;
}
function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ fatal('셰이더 오류: '+gl.getShaderInfoLog(s)); return null; }
  return s;
}
function fatal(msg){
  const d=document.createElement('div');
  d.className='fatal'; d.textContent=msg; document.body.appendChild(d);
}

function applyTexture(canvas){
  wake();
  texCanvas=canvas;
  if(!gl) return;
  if(!tex){
    tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    const an=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
    if(an){
      const max=gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
      gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(4,max));
    }
  }
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  buildAlphaGrid(canvas);
  buildIndex();
  GL.classList.add('ready');
  state.ready=true;
}

function buildAlphaGrid(canvas){
  const A=128, c=document.createElement('canvas');
  c.width=c.height=A;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.clearRect(0,0,A,A);
  x.drawImage(canvas,0,0,A,A);
  const d=x.getImageData(0,0,A,A).data;
  alphaGrid=new Float32Array(A*A);
  for(let i=0;i<A*A;i++) alphaGrid[i]=d[i*4+3]/255;
}
function alphaAt(u,v){
  if(!alphaGrid) return 1;
  const A=128;
  const x=clamp(Math.round(u*(A-1)),0,A-1), y=clamp(Math.round(v*(A-1)),0,A-1);
  return alphaGrid[y*A+x];
}
function quadAlpha(i,j){
  const u0=i/(GRID-1),u1=(i+1)/(GRID-1),v0=j/(GRID-1),v1=(j+1)/(GRID-1);
  return (alphaAt(u0,v0)+alphaAt(u1,v0)+alphaAt(u0,v1)+alphaAt(u1,v1))/4;
}
function buildIndex(){
  const arr=[];
  for(let j=0;j<GRID-1;j++)for(let i=0;i<GRID-1;i++){
    const v0=j*GRID+i, v1=v0+1, v2=(j+1)*GRID+i, v3=v2+1;
    arr.push(v0,v2,v1, v1,v2,v3);
  }
  const idx=new Uint16Array(arr);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  idxCount=idx.length;
}

/* =========================================================
   5. 천 물리 (Verlet + Distance constraints)
   ========================================================= */
const xs=new Float32Array(N), ys=new Float32Array(N), zs=new Float32Array(N);
const oxs=new Float32Array(N), oys=new Float32Array(N), ozs=new Float32Array(N);
const restNX=new Float32Array(N), restNY=new Float32Array(N);
const C_a=[], C_b=[], C_k=[], C_s=[];   // a,b, rest(배수), stiffness 계수

for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++){
  const k=j*GRID+i;
  restNX[k]=i/(GRID-1)-0.5;
  restNY[k]=0.5-j/(GRID-1);      // 화면 기준 위가 +y
}
function addC(a,b,restK,stiff){
  if(a<0||b<0||a>=N||b>=N) return;
  C_a.push(a); C_b.push(b); C_k.push(restK); C_s.push(stiff);
}
for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++){
  const k=j*GRID+i;
  if(i<GRID-1) addC(k,k+1,1,1.0);
  if(j<GRID-1) addC(k,k+GRID,1,1.0);
  if(i<GRID-1&&j<GRID-1) addC(k,k+GRID+1,1.4142,0.75);
  if(i>0&&j<GRID-1)     addC(k,k+GRID-1,1.4142,0.75);
  if(i<GRID-2) addC(k,k+2,2,0.22);
  if(j<GRID-2) addC(k,k+GRID*2,2,0.22);
}
const CA=Int32Array.from(C_a), CB=Int32Array.from(C_b), CK=Float32Array.from(C_k), CS=Float32Array.from(C_s);
const NCON=CA.length;

let clothCX=0, clothCY=0;

function spacing(){ return state.size/(GRID-1); }

function resetCloth(cx,cy){
  clothCX=cx; clothCY=cy;
  for(let k=0;k<N;k++){
    const x=cx+restNX[k]*state.size, y=cy+restNY[k]*state.size;
    xs[k]=oxs[k]=x; ys[k]=oys[k]=y; zs[k]=ozs[k]=0;
  }
}

function solve(iters){
  const sp=spacing();
  const soft=state.softness;
  const base=0.99-0.42*soft;          // 부드러움↑ → 강성↓
  for(let it=0;it<iters;it++){
    for(let c=0;c<NCON;c++){
      const a=CA[c], b=CB[c];
      const rest=sp*CK[c];
      let dx=xs[b]-xs[a], dy=ys[b]-ys[a], dz=zs[b]-zs[a];
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2<1e-9) continue;
      const d=Math.sqrt(d2);
      let diff=(d-rest)/d;
      // 과도한 늘어남 방지
      if(diff> 0.55) diff=0.55;
      if(diff<-0.55) diff=-0.55;
      const corr=diff*0.5*base*CS[c];
      xs[a]+=dx*corr; ys[a]+=dy*corr; zs[a]+=dz*corr;
      xs[b]-=dx*corr; ys[b]-=dy*corr; zs[b]-=dz*corr;
    }
  }
}

/* ---- grab ---- */
let carry=null;
function pickParticle(wx,wy){
  let best=-1,bd=1e9;
  for(let k=0;k<N;k++){
    if(alphaAt(restNX[k]+0.5, 0.5-restNY[k])<0.15) continue; // 구멍 속 투명 영역 제외
    const dx=xs[k]-wx, dy=ys[k]-wy;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=k;}
  }
  const lim=(state.size*0.16)**2;
  return bd<=lim?best:-1;
}

function applyCarry(){
  if(!carry) return;
  const S=state.size;
  const R=S*0.30;
  const gx=restNX[carry.idx]*S, gy=restNY[carry.idx]*S;
  for(let k=0;k<N;k++){
    const dx=restNX[k]*S-gx, dy=restNY[k]*S-gy;
    const d=Math.hypot(dx,dy);
    if(d>R) continue;
    const w0=1-d/R, w=w0*w0*(3-2*w0);
    const collapse=0.46+0.54*(1-w);
    const tx=carry.x+dx*collapse, ty=carry.y+dy*collapse;
    const tz=carry.z*(0.35+0.65*w);
    const k2=0.34*w+0.045;
    xs[k]+=(tx-xs[k])*k2;
    ys[k]+=(ty-ys[k])*k2;
    zs[k]+=(tz-zs[k])*k2;
  }
  xs[carry.idx]=carry.x; ys[carry.idx]=carry.y; zs[carry.idx]=carry.z;
}

/* ---- flatten animation ---- */
let flatAnim=null;
function startFlatten(fromX,fromY){
  wake();
  const half=state.size/2+10;
  const cx=clamp(centroidX(), -(Math.max(0,state.W/2-half)), Math.max(0,state.W/2-half));
  const cy=clamp(centroidY(), -(Math.max(0,state.H/2-half)), Math.max(0,state.H/2-half));
  const startX=Float32Array.from(xs), startY=Float32Array.from(ys), startZ=Float32Array.from(zs);
  const delay=new Float32Array(N);
  let maxd=1;
  for(let k=0;k<N;k++){
    const d=Math.hypot(xs[k]-fromX, ys[k]-fromY);
    if(d>maxd) maxd=d;
  }
  for(let k=0;k<N;k++){
    const d=Math.hypot(xs[k]-fromX, ys[k]-fromY);
    delay[k]=(d/maxd)*0.22;
  }
  const targets=new Float32Array(N*2);
  for(let k=0;k<N;k++){
    targets[k*2]=cx+restNX[k]*state.size;
    targets[k*2+1]=cy+restNY[k]*state.size;
  }
  flatAnim={t0:performance.now()/1000,startX,startY,startZ,delay,targets,dur:0.5};
}
function stepFlatten(){
  const now=performance.now()/1000;
  const t=(now-flatAnim.t0);
  let done=true;
  for(let k=0;k<N;k++){
    const p=clamp((t-flatAnim.delay[k])/flatAnim.dur,0,1);
    if(p<1) done=false;
    const e=easeOut(p);
    xs[k]=lerp(flatAnim.startX[k],flatAnim.targets[k*2],e);
    ys[k]=lerp(flatAnim.startY[k],flatAnim.targets[k*2+1],e);
    zs[k]=lerp(flatAnim.startZ[k],0,e);
    oxs[k]=xs[k]; oys[k]=ys[k]; ozs[k]=zs[k];
  }
  if(done||t>1.6){ flatAnim=null; }
}

/* ---- center animation ---- */
let centerAnim=null;
function startCenter(){
  wake();
  const cx=centroidX(), cy=centroidY();
  const dx=-cx, dy=-cy;
  if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
  centerAnim={t0:performance.now()/1000,dx,dy,dur:0.45,ox:0,oy:0};
}

function centroidX(){let s=0;for(let k=0;k<N;k++)s+=xs[k];return s/N;}
function centroidY(){let s=0;for(let k=0;k<N;k++)s+=ys[k];return s/N;}

/* ---- main step ---- */
let carryVel={x:0,y:0};
let lastSpeed=1;
let idle=false, idleFrames=0;
function wake(){ idle=false; idleFrames=0; }
function physics(dt){
  if(flatAnim){ stepFlatten(); return; }
  if(centerAnim){
    const now=performance.now()/1000;
    const p=clamp((now-centerAnim.t0)/centerAnim.dur,0,1);
    const e=easeInOut(p);
    const tx=centerAnim.dx*e-centerAnim.ox, ty=centerAnim.dy*e-centerAnim.oy;
    for(let k=0;k<N;k++){ xs[k]+=tx; ys[k]+=ty; oxs[k]+=tx; oys[k]+=ty; }
    centerAnim.ox=centerAnim.dx*e; centerAnim.oy=centerAnim.dy*e;
    if(p>=1) centerAnim=null;
  }

  const damp=0.988, dampZ=0.992, g=GRAV;
  for(let k=0;k<N;k++){
    let vx=(xs[k]-oxs[k])*damp;
    let vy=(ys[k]-oys[k])*damp;
    let vz=(zs[k]-ozs[k])*dampZ;
    oxs[k]=xs[k]; oys[k]=ys[k]; ozs[k]=zs[k];
    xs[k]+=vx; ys[k]+=vy; zs[k]+=vz-g*dt*dt;
    // 바닥
    if(zs[k]<FLOOR_Y){
      zs[k]=FLOOR_Y; ozs[k]=zs[k];
      oxs[k]=xs[k]-vx*0.88; oys[k]=ys[k]-vy*0.88;
    }
  }

  applyCarry();
  pushInside();

  const iters=4;
  solve(iters);
  applyCarry();
  pushInside();

  // 바닥 재체크
  let mvm=0;
  for(let k=0;k<N;k++){
    if(zs[k]<FLOOR_Y){ zs[k]=FLOOR_Y; ozs[k]=FLOOR_Y; }
    let v=Math.abs(xs[k]-oxs[k])+Math.abs(ys[k]-oys[k]);
    if(zs[k]>1) v+=Math.abs(zs[k]-ozs[k]);
    if(v>mvm) mvm=v;
  }
  lastSpeed=mvm;
  // 벽: 러그 전체를 밀어 되돌려 모양이 뭉개지지 않게
  pushInside();
}

function pushInside(){
  const limX=Math.max(20,state.W/2-6), limY=Math.max(20,state.H/2-6);
  const fitsX=state.size*0.5<=limX, fitsY=state.size*0.5<=limY;
  if(!fitsX&&!fitsY) return;
  let maxX=-1e9,minX=1e9,maxY=-1e9,minY=1e9;
  for(let k=0;k<N;k++){
    if(xs[k]>maxX)maxX=xs[k]; if(xs[k]<minX)minX=xs[k];
    if(ys[k]>maxY)maxY=ys[k]; if(ys[k]<minY)minY=ys[k];
  }
  let dx=0,dy=0;
  if(fitsX){ if(maxX>limX) dx=limX-maxX; else if(minX<-limX) dx=-limX-minX; }
  if(fitsY){ if(maxY>limY) dy=limY-maxY; else if(minY<-limY) dy=-limY-minY; }
  if(Math.abs(dx)>0.01||Math.abs(dy)>0.01){
    for(let k=0;k<N;k++){
      xs[k]+=dx; oxs[k]+=dx;
      ys[k]+=dy; oys[k]+=dy;
    }
  }
}

/* =========================================================
   6. 렌더
   ========================================================= */
const LX=-0.40, LY=0.52, LZ=0.75;
const LL=Math.hypot(LX,LY,LZ);
const lx=LX/LL, ly=LY/LL, lz=LZ/LL;
const HX=lx, HY=ly, HZ=lz+1;
const HL=Math.hypot(HX,HY,HZ);
const hx=HX/HL, hy=HY/HL, hz=HZ/HL;

function updateLights(){
  const sp=spacing();
  for(let j=0;j<GRID;j++){
    for(let i=0;i<GRID;i++){
      const k=j*GRID+i;
      const im=i>0?k-1:k, ip=i<GRID-1?k+1:k;
      const jm=j>0?k-GRID:k, jp=j<GRID-1?k+GRID:k;
      const txx=xs[ip]-xs[im], txy=ys[ip]-ys[im], txz=zs[ip]-zs[im];
      const tyx=xs[jp]-xs[jm], tyy=ys[jp]-ys[jm], tyz=zs[jp]-zs[jm];
      let nx=txy*tyz-txz*tyy, ny=txz*tyx-txx*tyz, nz=txx*tyy-txy*tyx;
      const nl=Math.hypot(nx,ny,nz)||1;
      nx/=nl; ny/=nl; nz/=nl;
      if(nz<0){ nx=-nx; ny=-ny; nz=-nz; }
      const diff=Math.max(0,nx*lx+ny*ly+nz*lz);
      const sdot=Math.max(0,nx*hx+ny*hy+nz*hz);
      const spec=Math.pow(sdot,20)*0.30;
      const lift=clamp(zs[k]/70,0,1);
      let L=0.60+0.58*diff+spec+0.10*lift;
      lightArr[k]=clamp(L,0.30,1.42);
      posArr[k*2]=xs[k];
      posArr[k*2+1]=ys[k];
    }
  }
}

function render(){
  if(!gl||!tex) return;
  const w=GL.width, h=GL.height;
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  updateLights();

  gl.useProgram(prog);
  gl.uniform2f(uRes,state.W,state.H);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(uTex,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER,posArr,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,uvBuf);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv,2,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,lightBuf);
  gl.bufferData(gl.ARRAY_BUFFER,lightArr,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aLight);
  gl.vertexAttribPointer(aLight,1,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBuf);
  gl.drawElements(gl.TRIANGLES,idxCount,gl.UNSIGNED_SHORT,0);

  drawShadow();
}

function drawShadow(){
  const {W,H,DPR}=state;
  if(shadowCanvas.width!==Math.round(W*DPR)||shadowCanvas.height!==Math.round(H*DPR)){
    shadowCanvas.width=Math.round(W*DPR); shadowCanvas.height=Math.round(H*DPR);
  }
  shadowCtx.setTransform(DPR,0,0,DPR,0,0);
  shadowCtx.clearRect(0,0,W,H);
  let avgZ=0;
  for(let k=0;k<N;k+=7) avgZ+=zs[k];
  avgZ/=Math.ceil(N/7);
  const off=8+avgZ*0.16, offY=13+avgZ*0.2;
  const p=new Path2D();
  const halfW=W/2, halfH=H/2;
  for(let j=0;j<GRID-1;j+=2){
    for(let i=0;i<GRID-1;i+=2){
      if(quadAlpha(i,j)<=0.06) continue;
      const a=j*GRID+i,b=a+2,c=a+2*GRID+1,d=a+2*GRID;
      p.moveTo(halfW+xs[a]+off, halfH-ys[a]+offY);
      p.lineTo(halfW+xs[b]+off, halfH-ys[b]+offY);
      p.lineTo(halfW+xs[c]+off, halfH-ys[c]+offY);
      p.lineTo(halfW+xs[d]+off, halfH-ys[d]+offY);
      p.closePath();
    }
  }
  shadowCtx.fillStyle='rgba(26,16,6,0.38)';
  shadowCtx.fill(p);
}

/* =========================================================
   7. 배경 (나무 / 사무실 / 딥그린)
   ========================================================= */
function drawFloor(){
  const {W,H,DPR}=state;
  if(floorCanvas.width!==Math.round(W*DPR)||floorCanvas.height!==Math.round(H*DPR)){
    floorCanvas.width=Math.round(W*DPR); floorCanvas.height=Math.round(H*DPR);
  }
  floorCtx.setTransform(DPR,0,0,DPR,0,0);
  floorCtx.clearRect(0,0,W,H);
  if(state.bg==='wood') drawWood(floorCtx,W,H);
  else if(state.bg==='green') drawGreen(floorCtx,W,H);
  else drawDesk(floorCtx,W,H);
}

function drawWood(ctx,W,H){
  const planks=Math.max(6,Math.round(W/210));
  const pw=W/planks;
  ctx.fillStyle='#8a6340'; ctx.fillRect(0,0,W,H);
  for(let p=0;p<planks;p++){
    const x=p*pw;
    const h1=28+Math.random()*10;
    const g=ctx.createLinearGradient(x,0,x+pw,0);
    g.addColorStop(0,'hsl('+h1+',34%,'+(38+Math.random()*7)+'%)');
    g.addColorStop(.5,'hsl('+h1+',30%,'+(45+Math.random()*7)+'%)');
    g.addColorStop(1,'hsl('+h1+',32%,'+(40+Math.random()*6)+'%)');
    ctx.fillStyle=g;
    ctx.fillRect(x,0,pw,H);
    // 나뭇결
    ctx.save();
    ctx.beginPath(); ctx.rect(x,0,pw,H); ctx.clip();
    for(let i=0;i<26;i++){
      const gx=x+Math.random()*pw;
      ctx.strokeStyle='rgba('+(60+Math.random()*40|0)+',40,20,'+(0.04+Math.random()*0.09)+')';
      ctx.lineWidth=0.6+Math.random()*2.2;
      ctx.beginPath();
      let yy=-20;
      ctx.moveTo(gx,yy);
      while(yy<H+20){
        yy+=40+Math.random()*60;
        ctx.bezierCurveTo(gx+Math.random()*10-5,yy-30,gx+Math.random()*12-6,yy-12,gx+Math.random()*8-4,yy);
      }
      ctx.stroke();
    }
    // 옹이
    if(Math.random()<0.5){
      const kx=x+20+Math.random()*(pw-40), ky=Math.random()*H;
      for(let r=7;r>0;r--){
        ctx.strokeStyle='rgba(66,40,20,'+(0.10-r*0.008)+')';
        ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.ellipse(kx,ky,r*2.4,r*1.2,Math.random(),0,TAU); ctx.stroke();
      }
    }
    ctx.restore();
    // 이음새
    ctx.fillStyle='rgba(48,28,14,.42)'; ctx.fillRect(x,0,2,H);
    ctx.fillStyle='rgba(255,238,214,.10)'; ctx.fillRect(x+2,0,1.4,H);
    // 판재 이음
    const jy=Math.random()*H;
    ctx.fillStyle='rgba(48,28,14,.35)'; ctx.fillRect(x,jy,pw,2);
  }
  // 바닥 전체 톤
  const v=ctx.createRadialGradient(W*0.5,H*0.42,H*0.15,W*0.5,H*0.5,H*0.95);
  v.addColorStop(0,'rgba(255,226,180,.10)');
  v.addColorStop(1,'rgba(40,22,8,.28)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

function drawGreen(ctx,W,H){
  const g=ctx.createLinearGradient(0,0,W*0.6,H);
  g.addColorStop(0,'#2A5540'); g.addColorStop(.55,'#1B3D2C'); g.addColorStop(1,'#0A1F17');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const r=ctx.createRadialGradient(W*0.5,H*0.42,10,W*0.5,H*0.45,Math.max(W,H)*0.62);
  r.addColorStop(0,'rgba(255,194,75,.13)');
  r.addColorStop(.45,'rgba(255,194,75,.03)');
  r.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
  // 미세 노이즈
  for(let i=0;i<2200;i++){
    ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.035)+')';
    ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2);
  }
  // 부드러운 비네트
  const v=ctx.createRadialGradient(W*0.5,H*0.42,Math.min(W,H)*0.25,W*0.5,H*0.46,Math.max(W,H)*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

function drawDesk(ctx,W,H){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1D3550'); g.addColorStop(.5,'#152B41'); g.addColorStop(1,'#0B1622');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 은은한 빛무리
  const blobs=[[0.22,0.28,0.42,'rgba(90,150,220,.20)'],[0.78,0.2,0.36,'rgba(255,194,75,.10)'],[0.55,0.85,0.5,'rgba(40,120,120,.16)']];
  blobs.forEach(([bx,by,br,col])=>{
    const r=ctx.createRadialGradient(W*bx,H*by,10,W*bx,H*by,Math.max(W,H)*br);
    r.addColorStop(0,col); r.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
  });
  // 아주 옅은 격자(모니터 느낌)
  ctx.strokeStyle='rgba(255,255,255,.022)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const b=ctx.createLinearGradient(0,H*0.55,0,H);
  b.addColorStop(0,'rgba(0,0,0,0)'); b.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=b; ctx.fillRect(0,0,W,H);
}

/* ---- 데스크탑 아이콘 ---- */
const ICON_DEFS=[
  {col:'left', kind:'folder', label:'업무 폴더'},
  {col:'left', kind:'folder', label:'2027 강의 섭외'},
  {col:'left', kind:'xlsx',  label:'11월 정산서.xlsx'},
  {col:'left', kind:'mail',  label:'안 읽은 메일 137'},
  {col:'right',kind:'doc',   label:'강의계획서.docx'},
  {col:'right',kind:'ppt',   label:'특강 자료.pptx'},
  {col:'right',kind:'pdf',   label:'청구서_모음.pdf'},
  {col:'right',kind:'trash', label:'휴지통'}
];
function iconSvg(kind){
  switch(kind){
    case 'folder': return '<svg viewBox="0 0 48 48"><path d="M5 15a4 4 0 0 1 4-4h9.2l3.6 4.6H39a4 4 0 0 1 4 4V34a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="#F0BE4E"/><path d="M5 20h38v14a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="#FFD46B"/><path d="M5 20h38v3H5z" fill="#C9973A" opacity=".55"/></svg>';
    case 'xlsx': return '<svg viewBox="0 0 48 48"><rect x="8" y="5" width="32" height="38" rx="3.5" fill="#1F7145"/><rect x="8" y="5" width="32" height="38" rx="3.5" fill="none" stroke="#0e4127" stroke-width="1.6"/><path d="M14 20l9 14M23 20l-9 14" stroke="#EAFFF2" stroke-width="3" stroke-linecap="round"/><path d="M8 12h32" stroke="#EAFFF2" stroke-width="2" opacity=".55"/></svg>';
    case 'mail': return '<svg viewBox="0 0 48 48"><rect x="5" y="11" width="38" height="26" rx="4" fill="#4E86C9"/><path d="M6 14l18 13L42 14" fill="none" stroke="#EAF2FF" stroke-width="2.6" stroke-linejoin="round"/><rect x="5" y="11" width="38" height="26" rx="4" fill="none" stroke="#2F639E" stroke-width="1.6"/><circle cx="37" cy="13" r="6" fill="#E2543F"/><text x="37" y="16.4" font-size="8" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">3</text></svg>';

    case 'ppt': return '<svg viewBox="0 0 48 48"><rect x="8" y="5" width="32" height="38" rx="3.5" fill="#D2692F"/><rect x="8" y="5" width="32" height="38" rx="3.5" fill="none" stroke="#8f4318" stroke-width="1.6"/><circle cx="24" cy="27" r="8.5" fill="#FFE0C4"/><path d="M24 27V18.5A8.5 8.5 0 0 1 32.5 27z" fill="#F7A86B"/><path d="M8 12h32" stroke="#FFE0C4" stroke-width="2" opacity=".5"/></svg>';
    case 'pdf': return '<svg viewBox="0 0 48 48"><path d="M11 5h18l9 9v29H11z" fill="#F6EFF2"/><path d="M29 5l9 9h-9z" fill="#D8C6CE"/><rect x="8" y="24" width="32" height="12" rx="3" fill="#C33B34"/><text x="24" y="33.4" font-size="9.5" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">PDF</text></svg>';
    case 'trash': return '<svg viewBox="0 0 48 48"><path d="M19 9h10v4H19z" fill="#9DB0C4"/><path d="M12 15h24l-2.6 25a3 3 0 0 1-3 2.7H17.6a3 3 0 0 1-3-2.7z" fill="#8FA6BE"/><path d="M15 15h18l-2 25a2 2 0 0 1-2 1.8H19a2 2 0 0 1-2-1.8z" fill="none" stroke="#61788F" stroke-width="1.4"/><path d="M20 21v14M24 21v14M28 21v14" stroke="#DCE7F3" stroke-width="1.8" stroke-linecap="round"/></svg>';

const iconEls=[];
function buildDesktop(){
  const left=$('deskLeft'), right=$('deskRight');
  left.innerHTML=''; right.innerHTML='';
  ICON_DEFS.forEach((def,idx)=>{
    const el=document.createElement('div');
    el.className='ico';
    el.innerHTML='<div class="ico-art">'+iconSvg(def.kind)+'</div><span>'+def.label+'</span>';
    (def.col==='left'?left:right).appendChild(el);
    iconEls.push({el,def});
  });
  $('coverT').textContent=ICON_DEFS.length;
  state.officeTotal=ICON_DEFS.length;
}

/* ---- 아이콘 덮임 판정 ---- */
let coverTimer=0;
function pointInQuad(px,py,ax,ay,bx,by,cx,cy,dx,dy){
  const s1=(bx-ax)*(py-ay)-(by-ay)*(px-ax);
  const s2=(cx-bx)*(py-by)-(cy-by)*(px-bx);
  const s3=(dx-cx)*(py-cy)-(dy-cy)*(px-cx);
  const s4=(ax-dx)*(py-dy)-(ay-dy)*(px-dx);
  const neg=(s1<0)||(s2<0)||(s3<0)||(s4<0);
  const pos=(s1>0)||(s2>0)||(s3>0)||(s4>0);
  return !(neg&&pos);
}
function clothAt(px,py){
  for(let j=0;j<GRID-1;j+=1){
    for(let i=0;i<GRID-1;i+=1){
      if(quadAlpha(i,j)<=0.1) continue;
      const a=j*GRID+i,b=a+1,c=a+GRID+1,d=a+GRID;
      if(zs[a]>70&&zs[b]>70&&zs[c]>70&&zs[d]>70) continue;
      if(pointInQuad(px,py,xs[a],ys[a],xs[b],ys[b],xs[c],ys[c],xs[d],ys[d])) return true;
    }
  }
  return false;
}
function updateCover(){
  if(state.bg!=='office'){ return; }
  let covered=0;
  const W=state.W,H=state.H;
  iconEls.forEach(({el})=>{
    const r=el.getBoundingClientRect();
    // 아이콘 영역 3x3 샘플
    let inside=0,total=0;
    for(let gy=0;gy<3;gy++)for(let gx=0;gx<3;gx++){
      const cx=r.left+r.width*(0.22+0.28*gx);
      const cy=r.top+r.height*(0.2+0.3*gy);
      const wx=cx-W/2, wy=H/2-cy;
      total++;
      if(clothAt(wx,wy)) inside++;
    }
    const cov=inside/total>=0.5;
    el.classList.toggle('covered',cov);
    if(cov) covered++;
  });
  if(covered!==state.covered){
    state.covered=covered;
    $('coverN').textContent=covered;
    if(covered===state.officeTotal&&covered>0){ toast('오늘 업무는 전부 러그 밑에. 수고했어요!'); }
  }
}

/* =========================================================
   8. 입력
   ========================================================= */
const stage=$('stage');
let pointerId=null;
let lastTap={t:0,x:0,y:0};
let downPt=null;

function toWorld(cx,cy){ return {x:cx-state.W/2, y:state.H/2-cy}; }

GL.addEventListener('pointerdown',e=>{
  wake();
  if(flatAnim) flatAnim=null;
  closeMenu();
  const w=toWorld(e.clientX,e.clientY);
  const idx=pickParticle(w.x,w.y);
  if(idx<0) return;
  GL.setPointerCapture(e.pointerId);
  pointerId=e.pointerId;
  carry={idx,x:w.x,y:w.y,z:24,vx:0,vy:0,hist:[{t:performance.now(),x:w.x,y:w.y}]};
  GL.classList.add('holding');
  state.dragging=true;
  hideHint();
  e.preventDefault();
},{passive:false});

GL.addEventListener('pointermove',e=>{
  if(!carry||e.pointerId!==pointerId) return;
  wake();
  const w=toWorld(e.clientX,e.clientY);
  carry.hist.push({t:performance.now(),x:w.x,y:w.y});
  if(carry.hist.length>6) carry.hist.shift();
  const dx=w.x-carry.x, dy=w.y-carry.y;
  const mx=Math.max(30,state.W/2-16), my=Math.max(30,state.H/2-16);
  carry.x=clamp(w.x,-mx,mx); carry.y=clamp(w.y,-my,my);
  const sp=Math.hypot(dx,dy);
  carry.speed=sp;
  carry.z=clamp(22+sp*0.75,22,52);
  e.preventDefault();
},{passive:false});

function endCarry(e){
  if(!carry) return;
  wake();
  const hist=carry.hist;
  const now=performance.now();
  const recent=hist.filter(h=>now-h.t<130);
  let vx=0,vy=0;
  if(recent.length>1){
    const a=recent[0], b=recent[recent.length-1];
    const dt=Math.max(16,(b.t-a.t))/1000;
    vx=(b.x-a.x)/dt; vy=(b.y-a.y)/dt;
  }
  vx=clamp(vx,-3200,3200); vy=clamp(vy,-3200,3200);
  const S=state.size, R=S*0.30;
  const gx=restNX[carry.idx]*S, gy=restNY[carry.idx]*S;
  const dtF=1/60;
  for(let k=0;k<N;k++){
    const dx=restNX[k]*S-gx, dy=restNY[k]*S-gy;
    const d=Math.hypot(dx,dy);
    if(d>R) continue;
    const w=1-d/R;
    oxs[k]=xs[k]-vx*w*dtF;
    oys[k]=ys[k]-vy*w*dtF;
    if(Math.hypot(vx,vy)>600) ozs[k]=zs[k]+Math.random()*3; // 살짝 들뜨게
  }
  carry=null; state.dragging=false;
  GL.classList.remove('holding');
  if(e&&e.pointerId!==undefined) try{GL.releasePointerCapture(e.pointerId);}catch(_){}
  pointerId=null;
}
GL.addEventListener('pointerup',e=>{
  // 모바일 더블탭
  if(e.pointerType==='touch'){
    const now=performance.now();
    if(now-lastTap.t<330 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){
      const w=toWorld(e.clientX,e.clientY);
      startFlatten(w.x,w.y); toast('스르륵 — 러그를 폈어요');
      lastTap={t:0,x:0,y:0};
    }else{
      lastTap={t:now,x:e.clientX,y:e.clientY};
    }
  }
  endCarry(e);
});
GL.addEventListener('pointercancel',endCarry);
GL.addEventListener('pointerleave',e=>{ if(carry&&e.buttons===0) endCarry(e); });

GL.addEventListener('dblclick',e=>{
  const w=toWorld(e.clientX,e.clientY);
  startFlatten(w.x,w.y);
  toast('스르륵 — 러그를 폈어요');
  e.preventDefault();
});

GL.addEventListener('wheel',e=>{
  e.preventDefault();
  wake();
  const k=Math.exp(-e.deltaY*0.0011);
  setZoom(state.zoom*k);
},{passive:false});

stage.addEventListener('contextmenu',e=>{
  e.preventDefault();
  openMenu(e.clientX,e.clientY);
});

/* 키보드 */
window.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='f'||e.key==='F'){ startFlatten(centroidX(),centroidY()); toast('러그를 폈어요'); }
  if(e.key==='c'||e.key==='C'){ startCenter(); }
  if(e.key==='1'){ setBg('wood'); }
  if(e.key==='2'){ setBg('office'); }
  if(e.key==='3'){ setBg('green'); }
  if(e.key==='Escape'){ closeMenu(); }
});

/* =========================================================
   9. 크기 / 배경 / 메뉴
   ========================================================= */
function setZoom(z,fromSlider){
  wake();
  z=clamp(z,0.45,1.65);
  if(Math.abs(z-state.zoom)<0.0001) return;
  const cx=centroidX(), cy=centroidY();
  const ratio=z/state.zoom;
  for(let k=0;k<N;k++){
    xs[k]=cx+(xs[k]-cx)*ratio; ys[k]=cy+(ys[k]-cy)*ratio;
    oxs[k]=cx+(oxs[k]-cx)*ratio; oys[k]=cy+(oys[k]-cy)*ratio;
  }
  state.zoom=z;
  state.size=state.baseSize*z;
  $('sizeVal').textContent=Math.round(z*100)+'%';
  if(!fromSlider) $('size').value=String(Math.round(z*100));
}

function setBg(bg){
  wake();
  state.bg=bg;
  document.querySelectorAll('#bgSeg button').forEach(b=>b.classList.toggle('on',b.dataset.bg===bg));
  $('desktop').classList.toggle('on',bg==='office');
  $('desktop').style.pointerEvents='none';
  $('taskbar').hidden=bg!=='office';
  $('officeHud').hidden=bg!=='office';
  if(bg==='office'){
    updateClock();
    state.covered=-1;
    setTimeout(updateCover,60);
  }else{
    iconEls.forEach(({el})=>el.classList.remove('covered'));
    state.covered=0;
  }
  drawFloor();
}

function updateClock(){
  const d=new Date();
  const hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0');
  const ap=hh<12?'오전':(hh<18?'오후':'저녁');
  const h12=hh%12===0?12:hh%12;
  $('tbClock').textContent=ap+' '+(hh<12?h12:hh)+':'+mm;
  $('tbDate').textContent=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const menu=$('menu');
function openMenu(cx,cy){
  menu.hidden=false;
  const rect=menu.getBoundingClientRect();
  let x=(cx===undefined? state.W-320: cx);
  let y=(cy===undefined? 70: cy);
  x=clamp(x,12,state.W-rect.width-12);
  y=clamp(y,12,state.H-rect.height-12);
  menu.style.left=x+'px';
  menu.style.top=y+'px';
}
function closeMenu(){ menu.hidden=true; }

$('btnFull').addEventListener('click',async ()=>{
  try{
    if(!document.fullscreenElement){ await document.documentElement.requestFullscreen(); }
    else{ await document.exitFullscreen(); }
  }catch(_){ toast('이 브라우저에서는 전체 화면이 안 돼요'); }
  setTimeout(resize,260);
});

$('btnMenu').addEventListener('click',e=>{
  e.stopPropagation();
  if(menu.hidden) openMenu(state.W-320,70); else closeMenu();
});
$('menuClose').addEventListener('click',closeMenu);
stage.addEventListener('pointerdown',e=>{
  if(!menu.hidden && !menu.contains(e.target)) closeMenu();
},true);

$('mFlatten').addEventListener('click',()=>{ startFlatten(centroidX(),centroidY()); toast('러그를 폈어요'); });
$('mCenter').addEventListener('click',()=>{ startCenter(); });
$('soft').addEventListener('input',e=>{
  state.softness=e.target.value/100;
  $('softVal').textContent=e.target.value+'%';
});
$('size').addEventListener('input',e=>{
  setZoom(e.target.value/100,true);
});
$('bgSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-bg]');
  if(b) setBg(b.dataset.bg);
});
$('mPhoto').addEventListener('click',()=>{ $('filePick').click(); closeMenu(); });
$('btnPhoto').addEventListener('click',()=>{ $('filePick').click(); });
$('mReset').addEventListener('click',()=>{
  if(luckyCanvas){ applyTexture(luckyCanvas); toast('러키로 돌아왔어요'); }
  closeMenu();
});

const filePick=$('filePick');
filePick.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    try{
      const c=buildPhotoTexture(img);
      photoCanvas=c;
      applyTexture(c);
      toast('사진을 러그로 만들었어요. 던져보세요!');
    }catch(err){ toast('이 사진은 불러오지 못했어요'); }
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{ toast('이미지를 읽을 수 없어요'); URL.revokeObjectURL(url); };
  img.src=url;
  filePick.value='';
});

/* =========================================================
   10. 토스트 / 힌트
   ========================================================= */
let toastTimer=null;
function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
let hintHidden=false;
function hideHint(){
  if(hintHidden) return;
  hintHidden=true;
  $('hint').classList.add('fade');
  setTimeout(()=>{$('hint').style.display='none';},800);
}

/* =========================================================
   11. 리사이즈 / 루프
   ========================================================= */
function resize(){
  wake();
  const W=window.innerWidth, H=window.innerHeight;
  const DPR=Math.min(window.devicePixelRatio||1,2);
  const first=state.W===0;
  const prevCX=first?0:centroidX(), prevCY=first?0:centroidY();
  state.W=W; state.H=H; state.DPR=DPR;
  GL.width=Math.round(W*DPR); GL.height=Math.round(H*DPR);
  GL.style.width=W+'px'; GL.style.height=H+'px';
  state.baseSize=Math.min(W,H)*0.66;
  if(first){
    state.size=state.baseSize*state.zoom;
    resetCloth(0,0);
  }else{
    const oldSize=state.size;
    state.size=state.baseSize*state.zoom;
    const r=state.size/(oldSize||state.size);
    for(let k=0;k<N;k++){
      xs[k]=prevCX+(xs[k]-prevCX)*r; ys[k]=prevCY+(ys[k]-prevCY)*r;
      oxs[k]=prevCX+(oxs[k]-prevCX)*r; oys[k]=prevCY+(oys[k]-prevCY)*r;
    }
  }
  drawFloor();
  if(gl) gl.viewport(0,0,GL.width,GL.height);
}

let lastT=performance.now(), acc=0;
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t; acc+=dt;
  if(!idle){
    const step=1/60; let guard=0;
    while(acc>=step&&guard<3){ physics(step); acc-=step; guard++; }
    if(guard>=3) acc=0.0001;
    if(guard===0) acc=Math.min(acc,step);
    render();
    const still=(lastSpeed<0.012)&&!carry&&!flatAnim&&!centerAnim;
    idleFrames=still?idleFrames+1:0;
    if(idleFrames>30){ idle=true; }
  }else{
    acc=0;
  }
  if(state.bg==='office'){
    coverTimer+=dt;
    if(coverTimer>0.18){ coverTimer=0; updateCover(); }
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   12. 부팅
   ========================================================= */
function boot(){
  buildDesktop();
  const ok=initGL();
  resize();
  window.addEventListener('resize',()=>{ resize(); });
  setBg('wood');
  if(!ok) return;
  const img=new Image();
  img.onload=()=>{
    const c=buildLuckyTexture(img);
    applyTexture(c);
    setTimeout(()=>toast('러그를 잡아당겨 보세요. 두 번 클릭하면 펴져요!'),600);
    setTimeout(hideHint,9000);
  };
  img.onerror=()=>fatal('러그 이미지를 불러오지 못했어요.');
  img.src=RUG_SRC;
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wake(); });
  setInterval(updateClock,15000);
  requestAnimationFrame(frame);
  // 디버그 훅 (검증용)
  window.__rug={
    get ready(){return state.ready;},
    state,
    particles:{xs,ys,zs},
    centroid:()=>({x:centroidX(),y:centroidY()}),
    flatness(){ // 0=완전히 펴짐
      const cx=centroidX(),cy=centroidY();let s=0;
      for(let k=0;k<N;k++){
        const tx=cx+restNX[k]*state.size, ty=cy+restNY[k]*state.size;
        s+=Math.hypot(xs[k]-tx,ys[k]-ty);
      }
      return s/N;
    },
    maxVel(){let m=0;for(let k=0;k<N;k++){m=Math.max(m,Math.hypot(xs[k]-oxs[k],ys[k]-oys[k]));}return m;},
    maxZ(){let m=0;for(let k=0;k<N;k++)m=Math.max(m,zs[k]);return m;},
    covered:()=>state.covered,
    isIdle:()=>idle,
    speed:()=>lastSpeed,
    flatten:(x,y)=>startFlatten(x===undefined?centroidX():x,y===undefined?centroidY():y),
    center:startCenter,
    setBg,setZoom,
    useUploaded:()=>{ if(photoCanvas){applyTexture(photoCanvas);return true;} return false;},
    resetLucky:()=>{ if(luckyCanvas) applyTexture(luckyCanvas); }
  };
}

boot();
})();
