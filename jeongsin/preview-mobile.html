<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>미리보기 · 화면 크기 확인</title>
<style>
  html,body{margin:0;background:#0A231B;font-family:system-ui,sans-serif}
  .stage{padding:16px;display:flex;gap:20px;align-items:flex-start}
  .phone{overflow:hidden;box-shadow:0 0 0 6px #1F3D2B,0 20px 50px rgba(0,0,0,.5);background:#0D2B22}
  .phone iframe{border:0;display:block}
  p{color:#FFC24B;font-size:12px;margin:0 0 8px}
</style>
</head>
<body>
<div class="stage">
  <div>
    <p id="cap">정신여고 2026 학사·시험 대시보드 — 미리보기</p>
    <div class="phone" id="phone"><iframe id="mob" src="index.html" title="미리보기"></iframe></div>
  </div>
</div>
<script>
  // ?w=1280&h=720 처럼 화면 크기를 지정해 확인한다. (기본: 모바일 390×844)
  const qp = new URLSearchParams(location.search);
  const w = Math.min(Math.max(parseInt(qp.get('w') || '390', 10) || 390, 320), 1600);
  const h = Math.min(Math.max(parseInt(qp.get('h') || '844', 10) || 844, 480), 1000);
  const phone = document.getElementById('phone');
  phone.style.width = w + 'px';
  phone.style.height = h + 'px';
  phone.style.borderRadius = w > 600 ? '8px' : '22px';
  const f = document.getElementById('mob');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  document.getElementById('cap').textContent =
    `정신여고 2026 학사·시험 대시보드 — ${w}×${h} 미리보기`;
  f.src = 'index.html?t=' + Date.now();   // 캐시된 예전 CSS를 피한다
</script>
</body>
</html>
